<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק מסיסות</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            max-width: 1200px;
            max-height: 800px;
            border: 2px solid #000;
            position: relative;
            overflow: hidden;
            background-color: #fff;
        }
        .molecule-group {
            position: absolute;
            width: 120px;
            height: 120px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        .molecule {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
            position: absolute;
            transition: all 0.5s ease-in-out;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .blue-group .molecule, .white-group .molecule {
            background-color: transparent;
            color: transparent;
        }
        .blue-group .molecule.CH4 {
            background-image: url('https://www.cjoint.com/doc/24_07/NGtfdiC7aF2_%D7%9E%D7%A9%D7%97%D7%A7-%D7%9E%D7%A1%D7%99%D7%A1%D7%9E%D7%95%D7%AA-5-.png');
        }
        .blue-group .molecule.CH3OCH3 {
            background-image: url('https://www.cjoint.com/doc/24_07/NGtfee45hL2_%D7%9E%D7%A9%D7%97%D7%A7-%D7%9E%D7%A1%D7%99%D7%A1%D7%9E%D7%95%D7%AA-6-.png');
        }
        .blue-group .molecule.NH3 {
            background-image: url('https://www.cjoint.com/doc/24_07/NGtfe2rZu82_%D7%9E%D7%A9%D7%97%D7%A7-%D7%9E%D7%A1%D7%99%D7%A1%D7%9E%D7%95%D7%AA-7-.png');
        }
        .blue-group .molecule.I2 {
            background-image: url('https://www.cjoint.com/doc/24_07/NGtffKu8SJ2_%D7%9E%D7%A9%D7%97%D7%A7-%D7%9E%D7%A1%D7%99%D7%A1%D7%9E%D7%95%D7%AA-8-.png');
        }
        .white-group .molecule.H2O {
            background-image: url('https://www.cjoint.com/doc/24_07/NGtd17RLmL2_%D7%9E%D7%A9%D7%97%D7%A7-%D7%9E%D7%A1%D7%99%D7%A1%D7%9E%D7%95%D7%AA-1-.png');
        }
        .white-group .molecule.CH3OH {
            background-image: url('https://www.cjoint.com/doc/24_07/NGtd3AToMl2_%D7%9E%D7%A9%D7%97%D7%A7-%D7%9E%D7%A1%D7%99%D7%A1%D7%9E%D7%95%D7%AA-2-.png');
        }
        .white-group .molecule.C8H18 {
            background-image: url('https://www.cjoint.com/doc/24_07/NGtd4of1I52_%D7%9E%D7%A9%D7%97%D7%A7-%D7%9E%D7%A1%D7%99%D7%A1%D7%9E%D7%95%D7%AA-3-.png');
        }
        .white-group .molecule.CH3COCH3 {
            background-image: url('https://www.cjoint.com/doc/24_07/NGtd45ww5S2_%D7%9E%D7%A9%D7%97%D7%A7-%D7%9E%D7%A1%D7%99%D7%A1%D7%9E%D7%95%D7%AA-4-.png');
        }
        .white-group .molecule.CS2 {
            background-image: url('https://www.cjoint.com/doc/24_07/NGstcFIzWd2_%D7%9E%D7%A9%D7%97%D7%A7-%D7%9E%D7%A1%D7%99%D7%A1%D7%9E%D7%95%D7%AA.png');
        }
        .snowman {
            width: 50px;
            height: 50px;
            position: absolute;
            background-image: url('https://www.cjoint.com/doc/24_07/NGuesz0F0Z2_iceball.png');
            background-size: contain;
            background-repeat: no-repeat;
        }
        #end-game-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image: url('https://www.cjoint.com/doc/24_07/NGurp7thBf2_123.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center 20%;
        }
        #start-screen h1, #start-screen select, #start-screen button {
            margin: 10px;
        }
        #controls {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        #start-screen {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-top: 25%;
        }
        body {
            background: linear-gradient(45deg, #f3f3f3, #e1e1e1);
        }
        #game-container {
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        .molecule-group {
            transition: all 0.3s ease-in-out;
        }
        .molecule-group:hover {
            transform: scale(1.05);
        }
        .molecule {
            transition: all 0.3s ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .molecule.pulse {
            animation: pulse 0.5s ease-in-out;
        }
        #controls, #level {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        #start-button, #close-high-scores {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            transition-duration: 0.4s;
            cursor: pointer;
            border-radius: 5px;
        }
        #instructions-button {
            position: absolute;
            bottom: 50px;
            right: 50px;
            padding: 50px 50px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        #instructions-button {
            font-size: 18px;
            padding: 15px;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        #name-display {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            font-weight: bold;
        }   
        #start-button:hover, #close-high-scores:hover {
            background-color: #45a049;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 500px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="start-screen">
            <select id="level-select">
                <option value="1">רמה 1</option>
                <option value="2">רמה 2</option>
                <option value="3">רמה 3</option>
            </select>
            <button id="start-button">התחל משחק</button>
            <button id="instructions-button">הנחיות</button>
        </div>
        <div id="level">רמה: <span id="level-value">1</span></div>
        <div id="controls">
            <div id="time-control">⏳ זמן: <span id="time-value">60</span></div>
            <div id="score-control">ניקוד: <span id="score-value">0</span></div>
        </div>
        <div id="end-game-message"></div>
    </div>

    <div id="name-modal" class="modal">
        <div class="modal-content">
            <h2>הכנס את שמך</h2>
            <input type="text" id="player-name-input">
            <button id="submit-name">התחל</button>
        </div>
    </div>
