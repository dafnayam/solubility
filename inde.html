        const gameContainer = document.getElementById('game-container');
        const startScreen = document.getElementById('start-screen');
        const levelSelect = document.getElementById('level-select');
        const startButton = document.getElementById('start-button');
        const scoreElement = document.getElementById('score-value');
        const levelElement = document.getElementById('level-value');
        const timeElement = document.getElementById('time-value');
        
        let score = 0;
        let level = 1;
        let timeLeft = 60;
        let blueGroup;
        let whiteGroups = [];
        let gameInterval;
        let snowmen = [];
        let gameOver = false;
        createNameDisplay();
        function createNameDisplay() {
    const nameDisplay = document.createElement('div');
    nameDisplay.id = 'name-display';
    nameDisplay.style.position = 'absolute';
    nameDisplay.style.top = '10px';
    nameDisplay.style.left = '10px';

    nameDisplay.style.fontWeight = 'bold';
    gameContainer.appendChild(nameDisplay);
}
        
        const blueFormulas = ['NH3', 'CH4', 'I2', 'CH3OCH3'];
        const whiteFormulas = ['H2O', 'CH3OH', 'C8H18', 'CS2', 'CH3COCH3'];
        
        startButton.addEventListener('click', startGame);
let highScores = [];

function updateHighScores(newScore) {
    const playerName = prompt("הכנס את שמך עבור טבלת התוצאות הגבוהות:");
    highScores.push({ name: playerName, score: newScore });
    highScores.sort((a, b) => b.score - a.score);
    highScores = highScores.slice(0, 5);  // שמור רק את 5 התוצאות הגבוהות ביותר
    
    const highScoresTable = document.getElementById('high-scores-table').getElementsByTagName('tbody')[0];
    highScoresTable.innerHTML = '';
    highScores.forEach((score, index) => {
        const row = highScoresTable.insertRow();
        row.insertCell(0).textContent = index + 1;
        row.insertCell(1).textContent = score.name;
        row.insertCell(2).textContent = score.score;
    });
    
    document.getElementById('high-scores').style.display = 'block';
}

document.getElementById('close-high-scores').addEventListener('click', () => {
    document.getElementById('high-scores').style.display = 'none';
    resetGame();
});        
function startGame() {
       // מוחק את כל הקבוצות והאובייקטים הקיימים
       if (blueGroup) blueGroup.remove();
       whiteGroups.forEach(group => group.remove());
       snowmen.forEach(snowman => snowman.remove());
       
       // מאפס את המערכים
       whiteGroups = [];
       snowmen = [];
       
       // מאתחל מחדש את המשחק
       level = parseInt(levelSelect.value);
       levelElement.textContent = level;
       score = 0;
       timeLeft = 60 + (level - 1) * 30;
       updateScore();
       updateTimer();
       
       startScreen.style.display = 'none';
       const playerName = prompt("הכנס את שמך:");
document.getElementById('name-display').textContent = `שחקן: ${playerName}`;
       createBlueGroup();
       createWhiteGroups();
       createSnowmen();
       
       if (gameInterval) {
           clearInterval(gameInterval);
       }
       gameInterval = setInterval(updateTimer, 1000);
       
       document.addEventListener('keydown', moveBlueGroup);
   }
        
        function createMolecule(formula, isBlue) {
            const molecule = document.createElement('div');
            molecule.className = `molecule ${isBlue ? 'blue-molecule' : 'white-molecule'} ${formula}`;
            return molecule;
        }
        
        function createMoleculeGroup(isBlue, formula) {
            const group = document.createElement('div');
            group.className = `molecule-group ${isBlue ? 'blue-group' : 'white-group'}`;
            for (let i = 0; i < 6; i++) {
                const molecule = createMolecule(formula, isBlue);
                molecule.style.left = `${(i % 3) * 40}px`;
                molecule.style.top = `${Math.floor(i / 3) * 40}px`;
                group.appendChild(molecule);
            }
            return group;
        }
        
        function createBlueGroup() {
            if (blueGroup) {
                blueGroup.remove();
            }
            const formula = blueFormulas[Math.floor(Math.random() * blueFormulas.length)];
            blueGroup = createMoleculeGroup(true, formula);
            blueGroup.style.left = '340px';
            blueGroup.style.top = '240px';
            gameContainer.appendChild(blueGroup);
        }
        
        function createWhiteGroups() {
            whiteGroups.forEach(group => group.remove());
            whiteGroups = [];
            const positions = [
                {left: 100, top: 100},
                {left: 350, top: 100},
                {left: 600, top: 100},
                {left: 100, top: 350},
                {left: 600, top: 350}
            ];
            whiteFormulas.forEach((formula, index) => {
                const group = createMoleculeGroup(false, formula);
                const randomPosition = positions.splice(Math.floor(Math.random() * positions.length), 1)[0];
                group.style.left = `${randomPosition.left}px`;
                group.style.top = `${randomPosition.top}px`;
                whiteGroups.push(group);
                gameContainer.appendChild(group);
            });
        }
function createSnowmen() {
    for (let i = 0; i < 3; i++) {
        let validPosition = false;
        let snowmanLeft, snowmanTop;
        
        while (!validPosition) {
            snowmanLeft = Math.random() * (gameContainer.clientWidth - 50);
            snowmanTop = Math.random() * (gameContainer.clientHeight - 50);
            
            // בדיקה שהמרחק מהקבוצה הכחולה הוא לפחות 100 פיקסלים
            const distanceFromBlue = Math.sqrt(
                Math.pow(snowmanLeft - 340, 2) + 
                Math.pow(snowmanTop - 240, 2)
            );
            
            if (distanceFromBlue > 100) {
                validPosition = true;
            }
        }
        
        const snowman = document.createElement('div');
        snowman.className = 'snowman';
        snowman.style.left = `${snowmanLeft}px`;
        snowman.style.top = `${snowmanTop}px`;
        gameContainer.appendChild(snowman);
        snowmen.push(snowman);
    }
}

function moveBlueGroup(event) {
    const key = event.key;
    const step = 7;  // הגדלנו את גודל הצעד
    let left = parseInt(blueGroup.style.left);
    let top = parseInt(blueGroup.style.top);
    
    switch (key) {
        case 'ArrowLeft':
            left = Math.max(0, left - step);
            break;
        case 'ArrowRight':
            left = Math.min(gameContainer.clientWidth - 120, left + step);
            break;
        case 'ArrowUp':
            top = Math.max(0, top - step);
            break;
        case 'ArrowDown':
            top = Math.min(gameContainer.clientHeight - 120, top + step);
            break;
    }
    
    blueGroup.style.left = `${left}px`;
    blueGroup.style.top = `${top}px`;
    
    checkCollision();
}
        function checkCollision() {
            const blueRect = blueGroup.getBoundingClientRect();
            const blueCenter = {
                x: blueRect.left + blueRect.width / 2,
                y: blueRect.top + blueRect.height / 2
            };
            
            whiteGroups.forEach(whiteGroup => {
                const whiteRect = whiteGroup.getBoundingClientRect();
                const whiteCenter = {
                    x: whiteRect.left + whiteRect.width / 2,
                    y: whiteRect.top + whiteRect.height / 2
                };
                
                const distance = Math.sqrt(
                    Math.pow(blueCenter.x - whiteCenter.x, 2) +
                    Math.pow(blueCenter.y - whiteCenter.y, 2)
                );
                
                if (distance < 60) {  // 60 is half the width/height of a group
                    handleCollision(blueGroup, whiteGroup);
                }
            });
            snowmen.forEach(snowman => {
    const snowmanRect = snowman.getBoundingClientRect();
    const distance = Math.sqrt(
        Math.pow(blueCenter.x - (snowmanRect.left + snowmanRect.width / 2), 2) +
        Math.pow(blueCenter.y - (snowmanRect.top + snowmanRect.height / 2), 2)
    );
    if (distance < 30) {
        endGame();
    }
});
        }
        
        
      function handleCollision(blue, white) {
            const blueFormula = blue.querySelector('.molecule').className.split(' ')[2];
            const whiteFormula = white.querySelector('.molecule').className.split(' ')[2];
        
        if (canMix(blueFormula, whiteFormula)) {
            mix(blue, white);
            playSound('mix');
            score++;
            updateScore();
            addPulseEffect(blue);
            addPulseEffect(white);
        } else {
            reject(blue, white);
            playSound('reject');
            score = Math.max(0, score - 1);
            updateScore();
        }
            
            setTimeout(() => {
                resetPositions(blue, white);
                createBlueGroup();  // Create a new blue group after each interaction
            }, 2000);
        }
        
        function canMix(formula1, formula2) {
            const solubilityRules = {
                'I2': ['C8H18', 'CS2'],
                'NH3': ['H2O', 'CH3OH', 'CH3COCH3'],
                'CH4': ['CS2', 'C8H18', 'CH3COCH3'],
                'CH3OCH3': ['CS2', 'C8H18', 'CH3COCH3', 'CH3OH', 'H2O']
            };
            
            return solubilityRules[formula1]?.includes(formula2) || solubilityRules[formula2]?.includes(formula1);
        }
        
        function mix(blue, white) {
            const whiteRect = white.getBoundingClientRect();
            const blueMolecules = [...blue.children];
            const whiteMolecules = [...white.children];
            
            const allMolecules = [...blueMolecules, ...whiteMolecules];
            
            allMolecules.forEach(molecule => {
                const randomX = Math.random() * (whiteRect.width - 40);
                const randomY = Math.random() * (whiteRect.height - 40);
                
                molecule.style.left = `${randomX}px`;
                molecule.style.top = `${randomY}px`;
                molecule.style.animation = 'uniform-mix 2s ease-in-out infinite';
            });
        }
        
        function reject(blue, white) {
            blue.style.animation = 'uniform-mix 0.5s ease-in-out';
            white.style.animation = 'uniform-mix 0.5s ease-in-out';
            
            setTimeout(() => {
                blue.style.animation = '';
                white.style.animation = '';
            }, 500);
        }
        
function resetPositions(blue, white) {
    blue.style.left = '340px';
    blue.style.top = '240px';
    
    const blueMolecules = [...blue.children];
    const whiteMolecules = [...white.children];
    
    blueMolecules.forEach((molecule, index) => {
        molecule.style.left = `${(index % 3) * 40}px`;
        molecule.style.top = `${Math.floor(index / 3) * 40}px`;
        molecule.style.animation = '';
    });
    
    whiteMolecules.forEach((molecule, index) => {
        molecule.style.left = `${(index % 3) * 40}px`;
        molecule.style.top = `${Math.floor(index / 3) * 40}px`;
        molecule.style.animation = '';
    });
    createWhiteGroups();
}

function playSound(type) {
       if (type === 'mix') {
           mixSound.play();
       } else if (type === 'reject') {
           rejectSound.play();
       }
   }


function updateTimer() {
    timeLeft--;
    timeElement.textContent = timeLeft;
    if (timeLeft <= 0) {
        endGame();
    }
}

function updateScore() {
    scoreElement.textContent = score;
}

function endGame() {
    clearInterval(gameInterval);
    document.removeEventListener('keydown', moveBlueGroup);
    const endGameMessage = document.getElementById('end-game-message');
    endGameMessage.innerHTML = `<h2>המשחק נגמר!</h2><p>הניקוד הסופי שלך: ${score}</p>`;
    endGameMessage.style.display = 'block';
    
    const playAgainButton = document.createElement('button');
    playAgainButton.textContent = 'שחק שוב';
    playAgainButton.onclick = () => {
        endGameMessage.style.display = 'none';
        resetGame();
    };
    endGameMessage.appendChild(playAgainButton);
    
    updateHighScores(score);
}


        function resetGame() {
            score = 0;
            timeLeft = 60;
            updateScore();
            updateTimer();
            
            if (blueGroup) {
                blueGroup.remove();
                blueGroup = null;
            }
            whiteGroups.forEach(group => group.remove());
            whiteGroups = [];
            
            startScreen.style.display = 'flex';
        }
        function resetGame() {
    score = 0;
    timeLeft = 60 + (level - 1) * 30;
    updateScore();
    updateTimer();
    
    if (blueGroup) {
        blueGroup.remove();
        blueGroup = null;
    }
    whiteGroups.forEach(group => group.remove());
    whiteGroups = [];
    snowmen.forEach(snowman => snowman.remove());
    snowmen = [];
    
    startScreen.style.display = 'flex';
}
document.getElementById('instructions-button').addEventListener('click', () => {
    const instructionsImage = document.createElement('img');
    instructionsImage.src = 'https://www.cjoint.com/doc/24_07/NGvgYUKpXh2_instruction1.png';
    instructionsImage.style.maxWidth = '80%';
    instructionsImage.style.maxHeight = '80%';
    instructionsImage.style.position = 'fixed';
    instructionsImage.style.top = '50%';
    instructionsImage.style.left = '50%';
    instructionsImage.style.transform = 'translate(-50%, -50%)';
    instructionsImage.style.zIndex = '1000';
    document.body.appendChild(instructionsImage);
    
    const closeButton = document.createElement('button');
    closeButton.textContent = 'X';
    closeButton.style.position = 'fixed';
    closeButton.style.top = '10%';
    closeButton.style.right = '10%';
    closeButton.style.zIndex = '1001';
    closeButton.style.fontSize = '24px';
    closeButton.style.padding = '10px 20px';
    closeButton.style.cursor = 'pointer';
    document.body.appendChild(closeButton);
    
    closeButton.onclick = () => {
        instructionsImage.remove();
        closeButton.remove();
    };
});
